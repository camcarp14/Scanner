name: ideafeed deploy (GitHub Pages)

# Publishes the app to GitHub Pages.
#
# Runs on every push that touches the app or the feed, which is what keeps the
# live site current: the scan job commits a refreshed feed.json every two hours,
# and that commit lands here and redeploys.
#
# The build step enables Pages itself (`enablement: true`) using the workflow
# token, so there is no Settings page to visit first.
# If you'd rather host on Netlify, ignore this file — see netlify.toml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      # configure-pages fails with "Resource not accessible by integration" when
      # Pages has never been turned on, which is not a useful thing to read at
      # 3am. Creating a Pages site needs repo-admin and the workflow token only
      # ever has `pages: write`, so no workflow can enable it for you — say so.
      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "::error title=GitHub Pages is not enabled::Go to Settings -> Pages and set Source to 'GitHub Actions', then re-run. A workflow cannot do this for you: creating a Pages site requires repo-admin, and the Actions token is capped at pages:write (deploy-only)."
            exit 1
          fi
          echo "Pages is enabled; deploying."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
