name: ideafeed deploy (GitHub Pages)

# Publishes the app to GitHub Pages.
#
# Runs on every push that touches the app or the feed, which is what keeps the
# live site current: the scan job commits a refreshed feed.json every two hours,
# and that commit lands here and redeploys.
#
# The build step enables Pages itself (`enablement: true`) using the workflow
# token, so there is no Settings page to visit first.
# If you'd rather host on Netlify, ignore this file — see web/netlify.toml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      # enablement: true turns Pages on and sets its source to Actions if it
      # isn't already configured, so a fresh repository needs no manual setup.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
