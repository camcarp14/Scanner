name: ideafeed scan

# Runs the pipeline: scout -> filter -> read -> extract -> score -> generate ->
# review -> publish. The refreshed feed is committed straight to the branch it
# runs on; any newly approved skills go out as a pull request instead, so
# nothing reaches the skills directory without a human merging it.
#
# Runs on `main`. Schedules only ever fire on the default branch, so keep this
# file there — a copy on another branch will never tick.
#
# TWO cadences, because the two halves of the pipeline cost wildly different
# amounts. Stages 1-3 (scout, filter, read) are GitHub API calls, which are
# free, and Actions minutes are free on a public repo — so collecting new
# candidates costs nothing and can run as often as is useful. Stages 4-8 are
# the model calls, and they are the entire bill.
#
#   07:17                  full run — new candidates AND new skills
#   01:17 / 13:17 / 19:17  scout only — new candidates, $0.00
#
# So the feed picks up new ideas four times a day for the price of one. Skill
# generation stays daily because that is the part that costs money, and because
# a repo worth writing up does not break out inside a six-hour window.

on:
  schedule:
    - cron: '17 7 * * *' # full — off the hour, away from the top-of-hour rush
    - cron: '17 1,13,19 * * *' # scout only, free
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        type: choice
        default: full
        options: [full, no-llm, mock-llm]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ideafeed-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scanner/package-lock.json

      - name: Install scanner dependencies
        working-directory: scanner
        run: npm ci

      - name: Test
        working-directory: scanner
        run: npm test

      - name: Run the pipeline
        working-directory: scanner
        env:
          # The default token is enough: everything the scanner reads is public,
          # and it raises the API limit from 60/hr to 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Without it, stages 4-8 are skipped and only candidates are
          # collected — the run still succeeds.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. Mirrors each run into the `the-pentagon` Postgres project.
          # feed.json is written either way; the sync is additive, and a failure
          # in it is logged rather than allowed to fail the scan.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Board Room's usage_log is per-user and its user_id column defaults
          # to auth.uid(); the service role has no session, so the id has to be
          # passed. Without it the usage mirror is skipped and nothing else
          # changes. Not a credential — an account identifier.
          BOARDROOM_USER_ID: ${{ vars.BOARDROOM_USER_ID || '0d2f6286-1780-49aa-9d48-d4a7dac2ce66' }}
        run: |
          # A manual dispatch says which mode it wants. A scheduled run doesn't,
          # so the cron expression that fired decides: the daily slot runs
          # everything, every other slot collects candidates only.
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then
            if [ "${{ github.event.schedule }}" = '17 7 * * *' ]; then
              mode=full
            else
              mode=no-llm
            fi
          fi
          echo "mode: $mode (schedule: '${{ github.event.schedule }}')"

          case "$mode" in
            no-llm)   node scan.mjs --no-llm ;;
            mock-llm) node scan.mjs --mock-llm ;;
            *)        node scan.mjs ;;
          esac

      - name: Commit the refreshed feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- web/public/feed.json; then
            echo "No feed changes."
          else
            new=$(node -e "console.log(require('./web/public/feed.json').stats.new_skills_this_run)")
            git add web/public/feed.json
            git commit -m "ideafeed: refresh feed (${new} new skills)"
            git push
          fi

      - name: Open a pull request for newly published skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skills are written to skills/ only when the reviewer
          # approved them AND they cleared the rule-based threshold. They still
          # go through a PR rather than straight onto the branch.
          #
          # -uall matters: without it git collapses a wholly-new skill into a
          # single `?? skills/<name>/` directory line, so the SKILL.md grep
          # counted zero and every commit and PR title read "0 new skill(s)".
          status=$(git status --porcelain -uall -- skills)
          if [ -z "$status" ]; then
            echo "No new skills this run."
            exit 0
          fi

          count=$(printf '%s\n' "$status" | grep -c 'SKILL\.md' || true)
          branch="skills-$(date -u +%Y%m%d-%H%M)"

          git checkout -b "$branch"
          git add skills
          git commit -m "ideafeed: ${count} new skill(s)"
          git push -u origin "$branch"

          names=$(git show --stat --name-only --pretty=format: HEAD \
            | grep 'SKILL.md' | sed 's|skills/||; s|/SKILL.md||' | sed 's/^/- /')

          # printf, not a heredoc: a heredoc delimiter has to sit at column 0,
          # and YAML block scalars indent every line. `EOF` indented by ten
          # spaces never terminates, so this step failed with "unexpected EOF"
          # — invisibly, because it only runs when a skill is actually
          # published, which had never happened.
          body=$(printf '%s\n' \
            "Extracted by the ideafeed pipeline from repositories discovered on GitHub." \
            "" \
            "Each of these passed the rule-based skill score **and** the reviewer stage." \
            "Worth checking before merge: that every step is actually in the source" \
            "project's documentation, and that the \`description\` line would route" \
            "correctly if an agent matched against it." \
            "" \
            "$names" \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")

          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1"

          # `gh pr create` is refused outright when the repository has "Allow
          # GitHub Actions to create and approve pull requests" turned off —
          # the API rejects it no matter what `permissions:` says, because the
          # restriction is on the actor, not the token scope. That took down
          # the whole run, which is the wrong trade: the skills are already
          # committed and pushed to $branch, so nothing is lost, and a human
          # still has to merge them either way. Degrade to a warning with the
          # compare link and let the rest of the run stand. Every other
          # failure still fails the step.
          set +e
          out=$(gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch" \
            --title "ideafeed: ${count} new skill(s)" \
            --body "$body" 2>&1)
          rc=$?
          set -e
          echo "$out"

          if [ $rc -eq 0 ]; then
            echo "Opened a pull request for ${count} new skill(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if printf '%s' "$out" | grep -qi 'not permitted to create or approve pull requests'; then
            echo "::warning title=Pull request not opened::${count} new skill(s) are pushed to ${branch}, but GitHub Actions is not allowed to open pull requests in this repository. Enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests, or open it by hand: ${compare}"
            {
              echo "### ${count} new skill(s) waiting on a pull request"
              echo
              echo "Branch \`${branch}\` is pushed. GitHub Actions is not permitted to open"
              echo "pull requests in this repository, so open it manually:"
              echo
              echo "${compare}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit $rc
