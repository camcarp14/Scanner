<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="A quiet feed of novel projects appearing on GitHub, scanned every few hours."
    />
    <title>ideafeed</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B0%3C/text%3E%3C/svg%3E" />
    <script>
      // Applied before first paint so the theme never flashes.
      try {
        var saved = localStorage.getItem('ideafeed.theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
