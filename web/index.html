<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Reusable agent skills, mined from GitHub every couple of hours."
    />
    <title>ideafeed</title>

    <!-- Tab icon: SVG where it's supported, 32px PNG for everything else. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="./favicon-32.png" sizes="32x32" type="image/png" />

    <!--
      Added to the iPhone home screen this becomes a standalone app: its own
      icon, no Safari chrome, and a translucent status bar that the sticky
      header sits under (the header pads itself with env(safe-area-inset-top)).
    -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ideafeed" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Tints the browser and status bar to match whichever theme is showing. -->
    <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
    <script>
      // Applied before first paint so the theme never flashes.
      try {
        var saved = localStorage.getItem('ideafeed.theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
