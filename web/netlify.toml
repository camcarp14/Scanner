# Netlify config for the ideafeed web app.
#
# In Netlify: "Add new site" → import this repo → set **Base directory** to
# `ideafeed/web`. Netlify then reads this file and everything else is inferred.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The feed is rewritten by the scanner every couple of hours, so it must not sit
# in the CDN cache. Everything else is content-hashed and can be cached hard.
[[headers]]
  for = "/feed.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single page app: anything that isn't a real file falls through to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
